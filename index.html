<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MatPad TV</title>
    <meta name="description" content="High-performance Android TV companion interface for MatPad smart sports &amp; gaming mat with D-pad &amp; gamepad navigation." />
    <meta property="og:title" content="MatPad TV" />
    <meta property="og:description" content="High-performance Android TV companion interface for MatPad smart sports &amp; gaming mat with D-pad &amp; gamepad navigation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Web Fonts for Crisp 10-foot TV UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">

    <!-- CSS Layers (Strict GPU-accelerated styling) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div id="app" data-theme="neutral">
      <!-- Hardware Accelerated Animated Background Layer (OffscreenCanvas / Worker) -->
      <div id="bg-layer">
        <canvas id="bg-canvas"></canvas>
      </div>

      <!-- Gliding Shared Focus Ring (Translates smoothly via transform) -->
      <div id="focus-ring" class="hidden"></div>

      <!-- Main Screen Viewport -->
      <main id="screen-container"></main>

      <!-- On-Screen TV Remote / Gamepad Hint Bar -->
      <aside class="hint-bar" aria-label="Navigation Hints">
        <div class="hint-item">
          <span class="hint-badge">▲▼◄►</span>
          <span>Navigate</span>
        </div>
        <div class="hint-item">
          <span class="hint-badge gamepad-a">OK / A</span>
          <span>Select</span>
        </div>
        <div class="hint-item">
          <span class="hint-badge gamepad-b">BACK / B</span>
          <span>Return</span>
        </div>
      </aside>

      <!-- Global Notification / Toast Stack -->
      <div id="toast-container" aria-live="polite"></div>

      <!-- Virtual Keyboard Dialog -->
      <div id="virtual-keyboard-overlay"></div>

      <!-- TV Performance & Diagnostic HUD (Toggle with 'D' key) -->
      <div id="debug-overlay"></div>
    </div>

    <!-- Core Script Modules (Pure Vanilla JS, zero build step required) -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/perf.js"></script>
    <script src="js/bg.js"></script>
    <script src="js/input.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/data.js"></script>
    <script src="js/router.js"></script>

    <!-- Screen Views -->
    <script src="js/ui/bootScreen.js"></script>
    <script src="js/ui/profileSelectScreen.js"></script>
    <script src="js/ui/profileEditScreen.js"></script>
    <script src="js/ui/mainScreen.js"></script>
    <script src="js/ui/categoryScreen.js"></script>

    <!-- App Bootstrap -->
    <script src="js/app.js"></script>
  </body>
</html>
